<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بثوث مصطفى جيم اوفر</title>

  <style>
    :root {
      --bg: #0f0f0f;
      --card: #181818;
      --card-light: #242424;
      --border: #333;
      --text: #fff;
      --muted: #aaa;
      --red: #e50914;
      --red-hover: #ff2633;
      --danger: #a90018;
      --green: #16803c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Tahoma, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      min-height: 70px;
      padding: 14px 5%;
      background: rgba(15, 15, 15, .96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 31px;
      background: var(--red);
      border-radius: 8px;
      font-size: 18px;
    }

    .brand h1 {
      font-size: clamp(16px, 2vw, 23px);
    }

    .admin-button,
    .publish-button {
      padding: 11px 18px;
      color: white;
      background: var(--red);
      border-radius: 7px;
      transition: .2s;
    }

    .admin-button:hover,
    .publish-button:hover {
      background: var(--red-hover);
      transform: translateY(-1px);
    }

    .container {
      width: min(1400px, 90%);
      margin: auto;
      padding: 42px 0 60px;
    }

    .hero {
      margin-bottom: 30px;
    }

    .hero h2 {
      margin-bottom: 8px;
      font-size: clamp(25px, 4vw, 38px);
    }

    .hero p {
      color: var(--muted);
      font-size: 15px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .video-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
      transition: .2s;
    }

    .video-card:hover {
      border-color: #666;
      transform: translateY(-4px);
    }

    .video-preview {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-preview video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      background: rgba(0, 0, 0, .2);
    }

    .play-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      padding-right: 3px;
      background: rgba(229, 9, 20, .95);
      border-radius: 50%;
      font-size: 25px;
    }

    .video-info {
      padding: 15px;
    }

    .video-title {
      display: -webkit-box;
      overflow: hidden;
      line-height: 1.6;
      text-overflow: ellipsis;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .delete-button {
      width: 100%;
      margin-top: 13px;
      padding: 10px;
      color: white;
      background: var(--danger);
      border-radius: 6px;
    }

    .delete-button:hover {
      background: #dc001d;
    }

    .empty-state {
      padding: 70px 20px;
      color: var(--muted);
      text-align: center;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .empty-icon {
      margin-bottom: 15px;
      font-size: 42px;
    }

    .loading {
      color: var(--muted);
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .82);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: min(570px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, .6);
    }

    .close-button {
      position: absolute;
      top: 12px;
      left: 14px;
      width: 34px;
      height: 34px;
      color: white;
      background: var(--card-light);
      border-radius: 50%;
      font-size: 22px;
    }

    .modal-title {
      margin-bottom: 24px;
      font-size: 23px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      color: white;
      background: #101010;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--red);
    }

    .file-input {
      padding: 10px !important;
    }

    .publish-button {
      width: 100%;
    }

    .message {
      display: none;
      margin-top: 13px;
      padding: 12px;
      border-radius: 7px;
      line-height: 1.7;
      text-align: center;
      font-size: 14px;
    }

    .error-message {
      color: #ffc0c0;
      background: rgba(176, 0, 32, .3);
    }

    .success-message {
      color: #b9f6c7;
      background: rgba(20, 130, 55, .3);
    }

    .uploading-message {
      color: #ffe7a3;
      background: rgba(160, 105, 0, .3);
    }

    .watch-modal .modal-content {
      width: min(1000px, 100%);
      padding: 18px;
    }

    .watch-video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 8px;
    }

    .watch-title {
      margin-top: 15px;
      font-size: 20px;
    }

    @media (max-width: 600px) {
      .header {
        padding: 12px 5%;
      }

      .admin-button {
        padding: 9px 11px;
        font-size: 13px;
      }

      .container {
        width: 92%;
        padding-top: 28px;
      }

      .video-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .modal-content {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">▶</div>
      <h1>بثوث مصطفى جيم اوفر</h1>
    </div>

    <button class="admin-button" id="adminButton">
      دخول الإدارة
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <h2>آخر الفيديوهات</h2>
      <p>شاهد أحدث البثوث والفيديوهات بجودة عالية.</p>
    </section>

    <section id="videoGrid" class="video-grid">
      <div class="loading">جارٍ تحميل الفيديوهات...</div>
    </section>
  </main>

  <div class="modal" id="pinModal">
    <div class="modal-content">
      <button class="close-button" data-close="pinModal">×</button>

      <h2 class="modal-title">دخول الإدارة</h2>

      <form id="pinForm">
        <div class="form-group">
          <label for="adminPin">رمز الإدارة</label>

          <input
            id="adminPin"
            type="password"
            placeholder="أدخل رمز الإدارة"
            autocomplete="off"
            required
          >
        </div>

        <button class="publish-button" type="submit">
          متابعة
        </button>

        <div class="message error-message" id="pinError">
          رمز الإدارة غير صحيح.
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <button class="close-button" data-close="uploadModal">×</button>

      <h2 class="modal-title">رفع فيديو جديد</h2>

      <form id="uploadForm">
        <div class="form-group">
          <label for="videoTitle">عنوان الفيديو</label>

          <input
            id="videoTitle"
            type="text"
            maxlength="120"
            placeholder="اكتب عنوان الفيديو"
            required
          >
        </div>

        <div class="form-group">
          <label for="videoFile">اختيار ملف الفيديو MP4</label>

          <input
            id="videoFile"
            class="file-input"
            type="file"
            accept="video/mp4"
            required
          >
        </div>

        <button class="publish-button" id="publishButton" type="submit">
          رفع ونشر الفيديو
        </button>

        <div class="message uploading-message" id="uploadingMessage">
          جاري رفع المقطع، يرجى الانتظار...
        </div>

        <div class="message error-message" id="uploadError"></div>

        <div class="message success-message" id="uploadSuccess">
          تم رفع ونشر الفيديو بنجاح.
        </div>
      </form>
    </div>
  </div>

  <div class="modal watch-modal" id="watchModal">
    <div class="modal-content">
      <button class="close-button" data-close="watchModal">×</button>

      <video
        id="watchVideo"
        class="watch-video"
        controls
        playsinline
      ></video>

      <h2 id="watchTitle" class="watch-title"></h2>
    </div>
  </div>

  <!-- مكتبات Firebase -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      onValue,
      remove
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    /*
      ضع إعدادات Firebase الخاصة بك هنا
    */
    const firebaseConfig = {
      apiKey: "ضع_مفتاح_API_هنا",
      authDomain: "ضع_اسم_المشروع.firebaseapp.com",
      databaseURL: "https://ضع_اسم_المشروع-default-rtdb.firebaseio.com",
      projectId: "ضع_معرف_المشروع_هنا",
      storageBucket: "ضع_اسم_المشروع.firebasestorage.app",
      messagingSenderId: "ضع_رقم_المرسل_هنا",
      appId: "ضع_معرف_التطبيق_هنا"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const ADMIN_PIN = "oplkoplk";
    const CATBOX_API = "https://catbox.moe/user/api.php";

    let isAdmin = false;
    let videos = [];

    const adminButton = document.getElementById("adminButton");
    const pinModal = document.getElementById("pinModal");
    const uploadModal = document.getElementById("uploadModal");
    const watchModal = document.getElementById("watchModal");

    const pinForm = document.getElementById("pinForm");
    const uploadForm = document.getElementById("uploadForm");

    const videoGrid = document.getElementById("videoGrid");
    const watchVideo = document.getElementById("watchVideo");
    const watchTitle = document.getElementById("watchTitle");

    const publishButton = document.getElementById("publishButton");
    const pinError = document.getElementById("pinError");
    const uploadError = document.getElementById("uploadError");
    const uploadSuccess = document.getElementById("uploadSuccess");
    const uploadingMessage = document.getElementById("uploadingMessage");

    function openModal(modal) {
      modal.classList.add("active");
    }

    function closeModal(modal) {
      modal.classList.remove("active");
    }

    function showMessage(element, text = "") {
      if (text) {
        element.textContent = text;
      }

      element.style.display = "block";
    }

    function hideMessage(element) {
      element.style.display = "none";
    }

    function renderVideos() {
      videoGrid.innerHTML = "";

      if (!videos.length) {
        videoGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎬</div>
            <p>لا توجد فيديوهات منشورة حاليًا.</p>
          </div>
        `;

        return;
      }

      [...videos]
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        .forEach(function (video) {
          const card = document.createElement("article");
          card.className = "video-card";

          card.innerHTML = `
            <div class="video-preview">
              <video
                src="${video.url}"
                preload="metadata"
                muted
                playsinline>
              </video>

              <div class="play-overlay">
                <div class="play-icon">▶</div>
              </div>
            </div>

            <div class="video-info">
              <h3 class="video-title"></h3>

              ${
                isAdmin
                  ? `
                    <button class="delete-button">
                      حذف الفيديو
                    </button>
                  `
                  : ""
              }
            </div>
          `;

          card.querySelector(".video-title").textContent = video.title;

          card.addEventListener("click", function (event) {
            if (event.target.classList.contains("delete-button")) {
              return;
            }

            watchVideo.src = video.url;
            watchTitle.textContent = video.title;
            openModal(watchModal);
          });

          if (isAdmin) {
            card
              .querySelector(".delete-button")
              .addEventListener("click", async function (event) {
                event.stopPropagation();

                const confirmDelete = confirm(
                  "هل أنت متأكد من حذف هذا الفيديو؟"
                );

                if (!confirmDelete) {
                  return;
                }

                try {
                  await remove(ref(database, "videos/" + video.id));
                  alert("تم حذف الفيديو من القائمة.");
                } catch (error) {
                  alert("تعذر حذف الفيديو.");
                }
              });
          }

          videoGrid.appendChild(card);
        });
    }

    /*
      الاستماع إلى قائمة الفيديوهات من Firebase
    */
    onValue(ref(database, "videos"), function (snapshot) {
      const data = snapshot.val() || {};

      videos = Object.entries(data).map(function ([id, video]) {
        return {
          id,
          ...video
        };
      });

      renderVideos();
    });

    /*
      رفع الملف إلى Catbox
    */
    async function uploadToCatbox(file) {
      const formData = new FormData();

      formData.append("reqtype", "fileupload");
      formData.append("fileToUpload", file);

      const response = await fetch(CATBOX_API, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        throw new Error("فشل الاتصال بخدمة رفع الملفات.");
      }

      const directUrl = (await response.text()).trim();

      if (!directUrl.startsWith("http")) {
        throw new Error("لم يتم الحصول على رابط مباشر للفيديو.");
      }

      return directUrl;
    }

    adminButton.addEventListener("click", function () {
      document.getElementById("adminPin").value = "";
      hideMessage(pinError);
      openModal(pinModal);
      document.getElementById("adminPin").focus();
    });

    pinForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const enteredPin = document.getElementById("adminPin").value;

      if (enteredPin === ADMIN_PIN) {
        isAdmin = true;
        hideMessage(pinError);
        closeModal(pinModal);
        openModal(uploadModal);
        renderVideos();
      } else {
        showMessage(pinError, "رمز الإدارة غير صحيح.");
      }
    });

    uploadForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      hideMessage(uploadError);
      hideMessage(uploadSuccess);

      const title = document
        .getElementById("videoTitle")
        .value
        .trim();

      const file = document.getElementById("videoFile").files[0];

      if (!title || !file) {
        showMessage(
          uploadError,
          "يرجى كتابة العنوان واختيار ملف الفيديو."
        );

        return;
      }

      if (file.type !== "video/mp4") {
        showMessage(
          uploadError,
          "يرجى اختيار ملف بصيغة MP4 فقط."
        );

        return;
      }

      if (file.size > 500 * 1024 * 1024) {
        showMessage(
          uploadError,
          "حجم الفيديو يجب ألا يتجاوز 500 ميغابايت."
        );

        return;
      }

      publishButton.disabled = true;
      publishButton.textContent = "جاري الرفع...";
      showMessage(uploadingMessage);

      try {
        const videoUrl = await uploadToCatbox(file);

        await push(ref(database, "videos"), {
          title,
          url: videoUrl,
          createdAt: Date.now()
        });

        hideMessage(uploadingMessage);
        showMessage(uploadSuccess);

        uploadForm.reset();

        setTimeout(function () {
          closeModal(uploadModal);
          hideMessage(uploadSuccess);
        }, 1200);

      } catch (error) {
        hideMessage(uploadingMessage);
        showMessage(
          uploadError,
          error.message || "حدث خطأ أثناء رفع الفيديو."
        );
      } finally {
        publishButton.disabled = false;
        publishButton.textContent = "رفع ونشر الفيديو";
      }
    });

    document.querySelectorAll("[data-close]").forEach(function (button) {
      button.addEventListener("click", function () {
        const modal = document.getElementById(
          button.getAttribute("data-close")
        );

        if (modal === watchModal) {
          watchVideo.pause();
          watchVideo.removeAttribute("src");
          watchVideo.load();
        }

        closeModal(modal);
      });
    });

    [pinModal, uploadModal, watchModal].forEach(function (modal) {
      modal.addEventListener("click", function (event) {
        if (event.target === modal) {
          closeModal(modal);
        }
      });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        document.querySelectorAll(".modal.active").forEach(function (modal) {
          closeModal(modal);
        });

        watchVideo.pause();
      }
    });
  </script>

</body>
</html>
